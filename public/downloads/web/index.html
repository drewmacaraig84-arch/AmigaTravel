<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Amiga Gracia Travel Services">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Amiga Gracia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Amiga Gracia</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #ffffff;">
  <div id="loading" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; z-index: 9999; transition: opacity 0.4s ease;">
    <img src="icons/Icon-192.png" alt="Amiga Gracia" style="width: 110px; height: 110px; border-radius: 24px; object-fit: contain; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); margin-bottom: 24px;" />
    <div style="width: 32px; height: 32px; border: 3px solid #eaf5e8; border-top-color: #216417; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </div>
  <script>
    window.addEventListener('load', function() {
      var loader = document.getElementById('loading');
      if (loader) {
        setTimeout(function() {
          loader.style.opacity = '0';
          setTimeout(function() { if (loader && loader.parentNode) loader.remove(); }, 400);
        }, 1200);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
