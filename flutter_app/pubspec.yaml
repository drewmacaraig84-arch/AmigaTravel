name: amiga_gracia
description: Amiga Gracia Travel Services — Book ferry, airline, and tour packages.
version: 1.0.142+154

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  http: any
  url_launcher: any
  image_picker: any
  shared_preferences: any
  open_filex: any
  package_info_plus: any
  path_provider: any
  intl: any
  flutter_app_badger: any
  video_player: any
  flutter_local_notifications: any
  flutter_svg: any
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

